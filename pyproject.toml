[project]
name = "frappe_mpsa_payments"
authors = [
    { name = "Navari Limited", email = "solutions@navari.co.ke"}
]
description = "Frappe Mpsa Payments"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "xlrd>=2.0.1",  # reads the legacy OLE2 .xls that Safaricom's portal exports
]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.isort]
profile = "black"
known_frappe = "frappe"
known_erpnext = "erpnext"
no_lines_before = ["ERPNEXT"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FRAPPE", "ERPNEXT", "FIRSTPARTY", "LOCALFOLDER"]

# These dependencies are only installed when developer mode is enabled.
# `bench setup requirements --dev` reads this table (not project.optional-dependencies),
# and CI runs it before `bench run-tests`, which imports every test_*.py in the app.
[tool.bench.dev-dependencies]
pytest = ">=8.0"        # the statement parser's tests are plain pytest
xlwt = ">=1.3.0"        # only needed to regenerate the synthetic statement fixture
